name = "clipflow-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# This Worker performs several round trips to Neon on most authenticated
# requests. Let Cloudflare run it closer to the observed database path.
[placement]
mode = "smart"



[vars]
ENVIRONMENT = "production"
DB_DRIVER = "neon-http"
# Public frontend URL used in LINE/in-app notification links
FRONTEND_URL = "https://clipflow-tmyda.vercel.app"

# ---- Database acceleration ----
# Opt-in: set DB_DRIVER = "hyperdrive" under [vars] to route API traffic through
# this pooled Hyperdrive connection instead of Neon's HTTP endpoint.
# Before enabling, DISABLE Hyperdrive query caching, otherwise reads can be up
# to 60s stale and saved changes appear to revert:
#   npx wrangler hyperdrive update 759487ab447d492ba8ee3262cb52d2e9 --caching-disabled true
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "759487ab447d492ba8ee3262cb52d2e9"

# ---- Queues ----
[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "clipflow-notifications"

[[queues.consumers]]
queue = "clipflow-notifications"
max_batch_size = 10
max_batch_timeout = 5

# ---- Cron Triggers ----
[triggers]
# Only crons with a handler in src/index.ts scheduled(). The previous */5 and
# */10 entries woke the Worker every few minutes and did nothing.
crons = ["0 17 * * *"]

# ---- Secrets (set via: wrangler secret put SECRET_NAME) ----
# DATABASE_URL
# LINE_CHANNEL_ACCESS_TOKEN
# LINE_CHANNEL_SECRET
# LINE_LIFF_ID
# GOOGLE_SERVICE_ACCOUNT_KEY
# JWT_SECRET
